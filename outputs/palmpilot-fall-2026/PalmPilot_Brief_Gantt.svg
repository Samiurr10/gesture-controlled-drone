<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FFFFFF"/><style>text{font-family:Arial,Helvetica,sans-serif}</style><text x="54" y="68" font-size="38" fill="#17324D" font-weight="700">PalmPilot semester plan</text><text x="54" y="107" font-size="24" fill="#657587">Physical hand controller. Simulated drone electronics and on-screen motion.</text><text x="54" y="151" font-size="15" fill="#657587" font-weight="700">BUILD IN THIS ORDER</text><rect x="54" y="174" width="481" height="290" rx="10" fill="#F3F6F9"/><rect x="54" y="174" width="481" height="8" rx="4" fill="#7964A4"/><text x="76" y="219" font-size="24" fill="#17324D" font-weight="700">1. Simulate the controller</text><text x="76" y="253" font-size="18" fill="#7964A4" font-weight="700">S0–S3</text><text x="76" y="297" font-size="20" fill="#25384B">Model hand peripherals in Simantic.</text><text x="76" y="328" font-size="20" fill="#25384B">Model hand sensing and controller logic.</text><text x="76" y="359" font-size="20" fill="#25384B">Prove commands, faults and recovery.</text><text x="76" y="431" font-size="17" fill="#7964A4" font-weight="700">Gate: controller simulation evidence</text><rect x="559" y="174" width="481" height="290" rx="10" fill="#F3F6F9"/><rect x="559" y="174" width="481" height="8" rx="4" fill="#287FB0"/><text x="581" y="219" font-size="24" fill="#17324D" font-weight="700">2. Build the hand controller</text><text x="581" y="253" font-size="18" fill="#287FB0" font-weight="700">C0–C7</text><text x="581" y="297" font-size="20" fill="#25384B">Build and calibrate the physical hands.</text><text x="581" y="328" font-size="20" fill="#25384B">Connect both hands to the hub/computer.</text><text x="581" y="359" font-size="20" fill="#25384B">Measure timing, fit and fault response.</text><text x="581" y="431" font-size="17" fill="#287FB0" font-weight="700">Gate: qualified physical controller</text><rect x="1064" y="174" width="481" height="290" rx="10" fill="#F3F6F9"/><rect x="1064" y="174" width="481" height="8" rx="4" fill="#348775"/><text x="1086" y="219" font-size="24" fill="#17324D" font-weight="700">3. Simulate the drone</text><text x="1086" y="253" font-size="18" fill="#348775" font-weight="700">D1–D4</text><text x="1086" y="297" font-size="20" fill="#25384B">Model drone hardware and MCU in Simantic.</text><text x="1086" y="328" font-size="20" fill="#25384B">Use its outputs to drive drone dynamics.</text><text x="1086" y="359" font-size="20" fill="#25384B">Render the resulting motion on screen.</text><text x="1086" y="431" font-size="17" fill="#348775" font-weight="700">Gate: repeatable controller-to-screen demo</text><text x="54" y="506" font-size="15" fill="#657587" font-weight="700">FINAL DEMONSTRATION SIGNAL PATH</text><rect x="54" y="526" width="280" height="77" rx="7" fill="#EEF3F7"/><text x="69" y="555" font-size="20" fill="#17324D">Physical hands</text><text x="69" y="582" font-size="20" fill="#17324D">and hub</text><path d="M 337 565 L 351 565 M 345 559 L 351 565 L 345 571" fill="none" stroke="#657587" stroke-width="2"/><rect x="357" y="526" width="280" height="77" rx="7" fill="#EEF3F7"/><text x="372" y="555" font-size="20" fill="#17324D">Computer</text><text x="372" y="582" font-size="20" fill="#17324D">command interface</text><path d="M 640 565 L 654 565 M 648 559 L 654 565 L 648 571" fill="none" stroke="#657587" stroke-width="2"/><rect x="660" y="526" width="280" height="77" rx="7" fill="#EEF3F7"/><text x="675" y="555" font-size="20" fill="#17324D">Simantic drone</text><text x="675" y="582" font-size="20" fill="#17324D">hardware and MCU</text><path d="M 943 565 L 957 565 M 951 559 L 957 565 L 951 571" fill="none" stroke="#657587" stroke-width="2"/><rect x="963" y="526" width="280" height="77" rx="7" fill="#EEF3F7"/><text x="978" y="555" font-size="20" fill="#17324D">Motor outputs</text><text x="978" y="582" font-size="20" fill="#17324D">and timing</text><path d="M 1246 565 L 1260 565 M 1254 559 L 1260 565 L 1254 571" fill="none" stroke="#657587" stroke-width="2"/><rect x="1266" y="526" width="280" height="77" rx="7" fill="#EEF3F7"/><text x="1281" y="555" font-size="20" fill="#17324D">Dynamics model</text><text x="1281" y="582" font-size="20" fill="#17324D">and screen display</text><text x="54" y="647" font-size="20" fill="#25384B">Only the hand controller is fabricated. Physical drone assembly, propulsion tests and flight are outside this project.</text><text x="54" y="683" font-size="19" fill="#657587">Implementation dates are unconfirmed. The workbook keeps dependency gates and the original course calendar.</text><text x="54" y="728" font-size="15" fill="#657587" font-weight="700">KEY COURSE DEADLINES — 2026</text><rect x="54" y="744" width="237" height="77" rx="8" fill="#EEF3F7"/><text x="70" y="775" font-size="22" fill="#17324D" font-weight="700">Sep 23</text><text x="70" y="803" font-size="17" fill="#17324D">Report 1</text><rect x="305" y="744" width="237" height="77" rx="8" fill="#EEF3F7"/><text x="321" y="775" font-size="22" fill="#17324D" font-weight="700">Oct 28</text><text x="321" y="803" font-size="17" fill="#17324D">Report 2</text><rect x="556" y="744" width="237" height="77" rx="8" fill="#EEF3F7"/><text x="572" y="775" font-size="22" fill="#17324D" font-weight="700">Dec 2</text><text x="572" y="803" font-size="17" fill="#17324D">Final presentation</text><rect x="807" y="744" width="237" height="77" rx="8" fill="#EEF3F7"/><text x="823" y="775" font-size="22" fill="#17324D" font-weight="700">Dec 7</text><text x="823" y="803" font-size="17" fill="#17324D">Video and poster</text><rect x="1058" y="744" width="237" height="77" rx="8" fill="#EEF3F7"/><text x="1074" y="775" font-size="22" fill="#17324D" font-weight="700">Dec 8</text><text x="1074" y="803" font-size="17" fill="#17324D">Expo</text><rect x="1309" y="744" width="237" height="77" rx="8" fill="#EEF3F7"/><text x="1325" y="775" font-size="22" fill="#17324D" font-weight="700">Dec 11</text><text x="1325" y="803" font-size="17" fill="#17324D">Final report + package</text><text x="54" y="864" font-size="16" fill="#657587">Scope revised September 16, 2026. Pocket / PPM / ELRS is optional. Controller capabilities: S0–S3. Drone MCU/output capabilities: D1.</text></svg>