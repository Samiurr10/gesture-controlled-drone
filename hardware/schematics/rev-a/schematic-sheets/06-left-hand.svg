ill="#176BA0" font-weight="700" text-anchor="start">POWER / BUTTON</text><text x="441" y="525.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">BT2 + SWL wiring is on sheet 07. D5 = SW4 enable.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Sources: S01, S09-S14. RC parts sit by the Feather. 3V is regulated 3.3 V; do not connect these dividers to BAT or USB.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="581" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Module-level interconnect drawing. Confirm received revisions and test with propellers removed.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">10</text></svg>