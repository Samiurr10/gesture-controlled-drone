ill="#163046" font-weight="400" text-anchor="start">BT4: protected 1S</text><text x="300" y="290.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">PPM buffer + health checks</text><rect x="523" y="227" width="125" height="107" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="523" y="227" width="4" height="107" fill="#7749A4" stroke="#7749A4" stroke-width="1"/><text x="536" y="247" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7749A4" font-weight="700" text-anchor="start">POCKET RADIO</text><text x="536" y="265.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Own 18650 cells</text><text x="536" y="277.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">DSC trainer input</text><text x="536" y="290.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Manual controls</text><rect x="712" y="179" width="100" height="210" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="712" y="179" width="4" height="210" fill="#176BA0" stroke="#176BA0" stroke-width="1"/><text x="725" y="199" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">AIRCRAFT</text><text x="725" y="217.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">RP1 V2</text><text x="725" y="229.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">CRSF</text><text x="725" y="242.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Kakute H7</text><text x="725" y="255.475" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Tekko ESC</text><text x="725" y="268.3" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">4 motors</text><text x="725" y="281.125" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">BT1: 4S</text><line x1="205" y1="221" x2="287" y2="249" stroke="#087C68" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="287" y1="249" x2="280.1020351706944" y2="250.19083215175903" stroke="#087C68" stroke-width="1.3"/><line x1="287" y1="249" x2="282.27096299344726" y2="243.8389720994113" stroke="#087C68" stroke-width="1.3"/><text x="230" y="217" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#087C68" font-weight="400" text-anchor="start">BLE</text><line x1="205" y1="337" x2="287" y2="302" stroke="#087C68" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="287" y1="302" x2="282.6675031637875" y2="307.4981334254644" stroke="#087C68" stroke-width="1.3"/><line x1="287" y1="302" x2="280.03262222109726" y2="301.3249837883043" stroke="#087C68" stroke-width="1.3"/><text x="230" y="345" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#087C68" font-weight="400" text-anchor="start">BLE</text><line x1="460" y1="281" x2="523" y2="281" stroke="#7749A4" stroke-width="1.3"/><line x1="523" y1="281" x2="516.8569220667674" y2="284.3559787702294" stroke="#7749A4" stroke-width="1.3"/><line x1="523" y1="281" x2="516.8569220667674" y2="277.6440212297706" stroke="#7749A4" stroke-width="1.3"/><text x="489" y="271" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#7749A4" font-weight="400" text-anchor="middle">2 wires</text><line x1="648" y1="281" x2="712" y2="281" stroke="#176BA0" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="712" y1="281" x2="705.8569220667674" y2="284.3559787702294" stroke="#176BA0" stroke-width="1.3"/><line x1="712" y1="281" x2="705.8569220667674" y2="277.6440212297706" stroke="#176BA0" stroke-width="1.3"/><text x="680" y="270" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#176BA0" font-weight="400" text-anchor="middle">ELRS</text><rect x="30" y="409" width="493" height="112" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="30" y="409" width="4" height="112" fill="#BD700B" stroke="#BD700B" stroke-width="1"/><text x="43" y="429" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#BD700B" font-weight="700" text-anchor="start">BUILD STATUS</text><text x="43" y="447.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Aircraft and sensor wiring: component-documented design, ready for revision matching and bench assembly.</text><text x="43" y="459.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Trainer buffer: a fully specified prototype circuit; Pocket input-level compatibility and radio fault handling still</text><text x="43" y="472.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">require bench validation. This is not a tested flight release.</text><rect x="541" y="409" width="271" height="112" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="541" y="409" width="4" height="112" fill="#176BA0" stroke="#176BA0" stroke-width="1"/><text x="554" y="429" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">HOW TO READ</text><text x="554" y="447.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Solid lines = wires. Dashed arrows = radio links. Dots =</text><text x="554" y="459.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">joined wires. Same named net = connected conductor</text><text x="554" y="472.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">within that power domain. NC = leave unconnected.</text><text x="554" y="485.475" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Colors are assembly suggestions; labels determine</text><text x="554" y="498.3" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">polarity.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Basis: S01. Four separate power domains; only the hub and Pocket share ground through their trainer cable.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="581" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Module-level interconnect drawing. Confirm received revisions and test with propellers removed.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">01</text></svg>