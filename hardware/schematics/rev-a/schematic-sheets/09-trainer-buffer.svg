"Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Initialize D5 LOW and D9 HIGH before starting valid timing. The buffer is not</text><text x="43" y="519.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">isolation.</text><rect x="429" y="456" width="383" height="75" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="429" y="456" width="4" height="75" fill="#176BA0" stroke="#176BA0" stroke-width="1"/><text x="442" y="476" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">CABLE / POWER</text><text x="442" y="494.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Connect only TIP = PPM and SLEEVE = ground. No radio power wire. Use a short</text><text x="442" y="506.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">shielded cable. Hub has BT4; Pocket retains its own cells. Add no capacitor to the</text><text x="442" y="519.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">PPM output.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Sources: S11, S25-S27, S29, S36-S37. Full 14-wire buffer netlist is on the following sheet; power/button circuits on 07 / 07B.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="581" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Module-level interconnect drawing. Confirm received revisions and test with propellers removed.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">16</text></svg>