38" height="26" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="681" y="167.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">JP2.2</text><rect x="431" y="177" width="117" height="26" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="438" y="193.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">3 GND</text><rect x="548" y="177" width="126" height="26" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="555" y="193.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">3</text><rect x="674" y="177" width="138" height="26" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="681" y="193.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">JP2.3</text><rect x="431" y="203" width="117" height="26" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="438" y="219.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">4 Y</text><rect x="548" y="203" width="126" height="26" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="555" y="219.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">4</text><rect x="674" y="203" width="138" height="26" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="681" y="219.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">JP1.3</text><rect x="431" y="229" width="117" height="26" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="438" y="245.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">5 VCC</text><rect x="548" y="229" width="126" height="26" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="555" y="245.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">6</text><rect x="674" y="229" width="138" height="26" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="681" y="245.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">JP1.1</text><rect x="431" y="255" width="117" height="26" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="438" y="271.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">No IC lead</text><rect x="548" y="255" width="126" height="26" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="555" y="271.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">5</text><rect x="674" y="255" width="138" height="26" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="681" y="271.4" font-family="Arial,Helvetica,sans-serif" font-size="9.4" fill="#163046" font-weight="400" text-anchor="start">JP1.2 unused</text><rect x="431" y="341" width="381" height="55" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="431" y="341" width="4" height="55" fill="#BD700B" stroke="#BD700B" stroke-width="1"/><text x="444" y="361" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#BD700B" font-weight="700" text-anchor="start">VERIFY BEFORE SOLDERING TO U8</text><text x="444" y="379.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Meter from each IC leg to its header. Carrier hole numbers do not equal five-pin IC</text><text x="444" y="391.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">numbers.</text><rect x="30" y="419" width="782" height="111" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><text x="45" y="442" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">MONO TS PLUG - TWO ELECTRICAL CONTACTS</text><rect x="63" y="470" width="194" height="26" fill="#E9EFF3" stroke="#163046" stroke-width="1"/><rect x="258" y="470" width="7" height="26" fill="#163046" stroke="#163046" stroke-width="1"/><rect x="265" y="470" width="64" height="26" fill="#FFFFFF" stroke="#163046" stroke-width="1"/><text x="158" y="487" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#163046" font-weight="700" text-anchor="middle">SLEEVE = H_GND</text><text x="297" y="487" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="middle">TIP</text><text x="365" y="471.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#163046" font-weight="400" text-anchor="start">One insulating band = TS. Use the Pocket DSC port. Tip -&gt; JP301.2; sleeve -&gt; U8 GND. A</text><text x="365" y="484.5" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#163046" font-weight="400" text-anchor="start">headphone TRS cable is not the selected cable.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Sources: S25-S27, S29, S37. Diagram is a connection locator, not a fabrication footprint or scale drawing.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="581" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Module-level interconnect drawing. Confirm received revisions and test with propellers removed.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">18</text></svg>