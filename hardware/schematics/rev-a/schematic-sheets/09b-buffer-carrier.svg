<svg xmlns="http://www.w3.org/2000/svg" width="842" height="595" viewBox="0 0 842 595"><rect x="0" y="0" width="842" height="595" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="30" y="25" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#176BA0" font-weight="700" text-anchor="start">PALMPILOT / MANTA FLOW</text><text x="812" y="25" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="end">REV A  |  14 SEP 2026  |  DEVELOPMENT SCHEMATIC</text><text x="30" y="51" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#163046" font-weight="700" text-anchor="start">09B / Buffer carrier + trainer plug detail</text><text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#506273" font-weight="400" text-anchor="start">The five-pin IC and a six-pad adapter do not have matching pin numbers at the upper-right position.</text><line x1="30" y1="80" x2="812" y2="80" stroke="#E9EFF3" stroke-width="1"/><rect x="30" y="97" width="375" height="299" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><text x="45" y="120" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">ADAFRUIT #1230 SOT23 FRONT</text><rect x="145" y="171" width="126" height="160" fill="#FFFFFF" stroke="#163046" stroke-width="1"/><rect x="174" y="197" width="71" height="102" fill="#163046" stroke="#163046" stroke-width="1"/><circle cx="184" cy="208" r="3" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><rect x="152" y="198" width="22" height="8" fill="#E9EFF3" stroke="#163046" stroke-width="1"/><text x="142" y="206" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="end">1 /OE</text><text x="67" y="220" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">pad 1</text><rect x="152" y="243" width="22" height="8" fill="#E9EFF3" stroke="#163046" stroke-wid