troke="#163046" stroke-width="1"/><text x="200" y="184" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#C33736" font-weight="400" text-anchor="start">JST BAT +</text><text x="200" y="210" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#384551" font-weight="400" text-anchor="start">JST BAT -</text><line x1="111" y1="181" x2="188" y2="181" stroke="#C33736" stroke-width="1"/><text x="141" y="175" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="400" text-anchor="start">LP1</text><line x1="111" y1="207" x2="188" y2="207" stroke="#384551" stroke-width="1"/><text x="141" y="220" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#384551" font-weight="400" text-anchor="start">LP2</text><text x="42" y="249" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="400" text-anchor="start">EN</text><line x1="65" y1="246" x2="126" y2="246" stroke="#176BA0" stroke-width="1"/><circle cx="126" cy="246" r="2" fill="#FFFFFF" stroke="#176BA0" stroke-width="1"/><line x1="128" y1="246" x2="162" y2="231" stroke="#176BA0" stroke-width="1"/><circle cx="165" cy="246" r="2" fill="#FFFFFF" stroke="#384551" stroke-width="1"/><line x1="167" y1="246" x2="224" y2="246" stroke="#384551" stroke-width="1"/><line x1="224" y1="246" x2="224" y2="253" stroke="#384551" stroke-width="1"/><line x1="218.0" y1="253" x2="230.0" y2="253" stroke="#384551" stroke-width="1"/><line x1="220.0" y1="257" x2="228.0" y2="257" stroke="#384551" stroke-width="1"/><line x1="222.0" y1="261" x2="226.0" y2="261" stroke="#384551" stroke-width="1"/><text x="232" y="262" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#384551" font-weight="400" text-anchor="start">L_GND</text><text x="113" y="276" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#163046" font-weight="400" text-anchor="start">SWL OFF closes to GND</text><text x="42" y="301.0" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">Use common + one throw on a slide switch. Other throw</text><text x="42" y="313.15" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">NC. Open = ON. Feed no voltage into EN.</text><rect x="297" y="100" width="248" height="269" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><text x="309" y="121" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#163046" font-weight="700" text-anchor="start">R: U7 + BT3</text><text x="309" y="147" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">#1578 protected 1S cell</text><rect x="309" y="165" width="69" height="57" fill="#FFFFFF" stroke="#163046" stroke-width="1"/><text x="317" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#163046" font-weight="700" text-anchor="start">LiPo</text><text x="371" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#C33736" font-weight="400" text-anchor="end">+</text><text x="371" y="211" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#384551" font-weight="400" text-anchor="end">-</text><rect x="455" y="165" width="76" height="57" fill="#FFFFFF" stroke="#163046" stroke-width="1"/><text x="467" y="184" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#C33736" font-weight="400" text-anchor="start">JST BAT +</text><text x="467" y="210" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#384551" font-weight="400" text-anchor="start">JST BAT -</text><line x1="378" y1="181" x2="455" y2="181" stroke="#C33736" stroke-width="1"/><text x="408" y="175" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="400" text-anchor="start">RP1</text><line x1="378" y1="207" x2="455" y2="207" stroke="#384551" stroke-width="1"/><text x="408" y="220" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#384551" font-weight="400" 