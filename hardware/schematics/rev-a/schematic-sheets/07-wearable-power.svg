ght="57" fill="#FFFFFF" stroke="#163046" stroke-width="1"/><text x="584" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#163046" font-weight="700" text-anchor="start">LiPo</text><text x="638" y="185" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#C33736" font-weight="400" text-anchor="end">+</text><text x="638" y="211" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#384551" font-weight="400" text-anchor="end">-</text><rect x="722" y="165" width="76" height="57" fill="#FFFFFF" stroke="#163046" stroke-width="1"/><text x="734" y="184" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#C33736" font-weight="400" text-anchor="start">JST BAT +</text><text x="734" y="210" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#384551" font-weight="400" text-anchor="start">JST BAT -</text><line x1="645" y1="181" x2="722" y2="181" stroke="#C33736" stroke-width="1"/><text x="675" y="175" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="400" text-anchor="start">HP1</text><line x1="645" y1="207" x2="722" y2="207" stroke="#384551" stroke-width="1"/><text x="675" y="220" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#384551" font-weight="400" text-anchor="start">HP2</text><text x="576" y="249" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="400" text-anchor="start">EN</text><line x1="599" y1="246" x2="660" y2="246" stroke="#176BA0" stroke-width="1"/><circle cx="660" cy="246" r="2" fill="#FFFFFF" stroke="#176BA0" stroke-width="1"/><line x1="662" y1="246" x2="696" y2="231" stroke="#176BA0" stroke-width="1"/><circle cx="699" cy="246" r="2" fill="#FFFFFF" stroke="#384551" stroke-width="1"/><line x1="701" y1="246" x2="758" y2="246" stroke="#384551" stroke-width="1"/><line x1="758" y1="246" x2="758" y2="253" stroke="#384551" stroke-width="1"/><line x1="752.0" y1="253" x2="764.0" y2="253" stroke="#384551" stroke-width="1"/><line x1="754.0" y1="257" x2="762.0" y2="257" stroke="#384551" stroke-width="1"/><line x1="756.0" y1="261" x2="760.0" y2="261" stroke="#384551" stroke-width="1"/><text x="766" y="262" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#384551" font-weight="400" text-anchor="start">H_GND</text><text x="647" y="276" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#163046" font-weight="400" text-anchor="start">SWH OFF closes to GND</text><text x="576" y="301.0" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">Use common + one throw on a slide switch. Other throw</text><text x="576" y="313.15" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">NC. Open = ON. Feed no voltage into EN.</text><rect x="30" y="387" width="379" height="142" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="30" y="387" width="4" height="142" fill="#087C68" stroke="#087C68" stroke-width="1"/><text x="43" y="407" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#087C68" font-weight="700" text-anchor="start">SW4 - LEFT-HAND ENABLE</text><text x="43" y="425.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">U6 D5 (P1.08) uses the filtered button circuit on sheet 07B. Pressed = LOW.</text><text x="43" y="437.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Release must invalidate gesture authority in the hub. This is an input request, not a</text><text x="43" y="450.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">motor-power cut. A5 remains spare and A6 is the onboard battery monitor.</text><rect x="428" y="387" width="384" height="142" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="428" y="387" width="4" height="142" fill="#176BA0" stroke="#176BA0" stroke-width="1"/><text x="441" y="407" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">SW5 - HUB CALIBRATION</text><text x="441" y="425.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">U8 D6 (P0.07) uses sheet 07B. Only accept calibration while radio gesture authority</text><text x="441" y="437.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">is OFF and aircraft disarmed. Use opposite contact groups of a 4-leg pushbutton;</text><text x="441" y="450.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">two legs from the same group are already connected.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Sources: S09-S13. Use onboard Micro-USB to program/charge; charge off the wearer. No separate charger board or shared battery rail.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="575" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="700" text-anchor="start">HISTORICAL FULL-SYSTEM DESIGN - aircraft/trainer build and flight steps are outside current scope.</text><text x="30" y="587" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Current scope: Simantic controller -&gt; physical controller -&gt; simulated drone on screen. See project README.md.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">12</text></svg>