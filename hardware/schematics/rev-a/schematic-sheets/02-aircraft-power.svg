A0" stroke-width="1.3"/><text x="694" y="379" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#176BA0" font-weight="400" text-anchor="start">M4</text><text x="610" y="371" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="middle">E08</text><rect x="30" y="326" width="344" height="80" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="30" y="326" width="4" height="80" fill="#C33736" stroke="#C33736" stroke-width="1"/><text x="43" y="346" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#C33736" font-weight="700" text-anchor="start">DO NOT ADD A SMALL POWER SWITCH</text><text x="43" y="364.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Disconnect the XT60 to isolate the aircraft. The small wearable switches</text><text x="43" y="376.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">are only for Feather EN. BT1 balance plug remains disconnected in flight;</text><text x="43" y="389.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">use it only at the charger.</text><rect x="30" y="429" width="371" height="101" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="30" y="429" width="4" height="101" fill="#176BA0" stroke="#176BA0" stroke-width="1"/><text x="43" y="449" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">5 V POWER IS MADE ON THE FC</text><text x="43" y="467.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">U2 passes battery voltage through E01. U1 regulates it. The receiver, GNSS,</text><text x="43" y="479.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Remote ID and buzzer each take 5V + G from U1 (next sheet). Do not add a</text><text x="43" y="492.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">second 5 V supply in parallel.</text><rect x="419" y="429" width="393" height="101" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="419" y="429" width="4" height="101" fill="#176BA0" stroke="#176BA0" stroke-width="1"/><text x="432" y="449" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#176BA0" font-weight="700" text-anchor="start">PHYSICAL INSTALLATION</text><text x="432" y="467.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Keep the battery pair short and together. Mount C1 at U2 power pads with insulated</text><text x="432" y="479.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">leads and body restraint. Motor current flows through U2, not through the small</text><text x="432" y="492.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">harness or U1 ground pads.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Sources: S01-S04. Exact physical connector orientation is on sheet 04. Motor phase connections are on sheet 05.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="575" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="700" text-anchor="start">HISTORICAL FULL-SYSTEM DESIGN - aircraft/trainer build and flight steps are outside current scope.</text><text x="30" y="587" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Current scope: Simantic controller -&gt; physical controller -&gt; simulated drone on screen. See project README.md.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">03</text></svg>