font-size="9" fill="#C33736" font-weight="400" text-anchor="start">5V</text><text x="250" y="308" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A05</text><text x="180" y="340" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#384551" font-weight="400" text-anchor="end">G</text><line x1="188" y1="337" x2="326" y2="337" stroke="#384551" stroke-width="1.2"/><text x="334" y="340" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#384551" font-weight="400" text-anchor="start">G</text><text x="250" y="332" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A06</text><text x="180" y="364" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#176BA0" font-weight="400" text-anchor="end">TX</text><line x1="188" y1="361" x2="326" y2="361" stroke="#176BA0" stroke-width="1.2"/><text x="334" y="364" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#176BA0" font-weight="400" text-anchor="start">R4</text><text x="250" y="356" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A07</text><text x="180" y="388" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#7749A4" font-weight="400" text-anchor="end">RX</text><line x1="188" y1="385" x2="326" y2="385" stroke="#7749A4" stroke-width="1.2"/><text x="334" y="388" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#7749A4" font-weight="400" text-anchor="start">T4</text><text x="250" y="380" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A08</text><text x="180" y="412" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#087C68" font-weight="400" text-anchor="end">CL</text><line x1="188" y1="409" x2="326" y2="409" stroke="#087C68" stroke-width="1.2"/><text x="334" y="412" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#087C68" font-weight="400" text-anchor="start">SCL</text><text x="250" y="404" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A09</text><text x="180" y="436" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#BD700B" font-weight="400" text-anchor="end">DA</text><line x1="188" y1="433" x2="326" y2="433" stroke="#BD700B" stroke-width="1.2"/><text x="334" y="436" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#BD700B" font-weight="400" text-anchor="start">SDA</text><text x="250" y="428" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A10</text><rect x="635" y="107" width="177" height="144" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><text x="647" y="128" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#163046" font-weight="700" text-anchor="start">U5 / DRONETAG</text><text x="495" y="154" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#C33736" font-weight="400" text-anchor="end">5V</text><line x1="503" y1="151" x2="635" y2="151" stroke="#C33736" stroke-width="1.2"/><text x="643" y="154" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#C33736" font-weight="400" text-anchor="start">1 VCC</text><text x="563" y="146" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A11</text><text x="495" y="180" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#384551" font-weight="400" text-anchor="end">G</text><line x1="503" y1="177" x2="635" y2="177" stroke="#384551" stroke-width="1.2"/><text x="643" y="180" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#384551" font-weight="400" text-anchor="start">4 GND</text><text x="563" y="172" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A12</text><text x="647" y="201.0" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">4-pin: 2 RX / 3 TX = NC</text><text x="647" y="213.15" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">3-pin socket: empty</text><text x="647" y="225.3" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">Two marked RF antennas.</text><rect x="635" y="281" width="177" height="137" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><text x="647" y="302" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#163046" font-weight="700" text-anchor="start">BZ1 / FINDER 2</text><text x="495" y="328" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#C33736" font-weight="400" text-anchor="end">5V</text><line x1="503" y1="325" x2="635" y2="325" stroke="#C33736" stroke-width="1.2"/><text x="643" y="328" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#C33736" font-weight="400" text-anchor="start">5V</text><text x="563" y="320" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A13</text><text x="495" y="357" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#384551" font-weight="400" text-anchor="end">G</text><line x1="503" y1="354" x2="635" y2="354" stroke="#384551" stroke-width="1.2"/><text x="643" y="357" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#384551" font-weight="400" text-anchor="start">GND</text><text x="563" y="349" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A14</text><text x="495" y="386" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#BD700B" font-weight="400" text-anchor="end">Z-</text><line x1="503" y1="383" x2="635" y2="383" stroke="#BD700B" stroke-width="1.2"/><text x="643" y="386" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#BD700B" font-weight="400" text-anchor="start">BZ</text><text x="563" y="378" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A15</text><text x="340" y="466.0" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#163046" font-weight="400" text-anchor="start">Repeated 5V and G labels share U1</text><text x="340" y="477.475" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#163046" font-weight="400" text-anchor="start">rails. Use a soldered, insulated</text><text x="340" y="488.95" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#163046" font-weight="400" text-anchor="start">distribution joint if a pad cannot hold all</text><text x="340" y="500.425" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#163046" font-weight="400" text-anchor="start">branches. Do not crowd four wires onto</text><text x="340" y="511.9" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#163046" font-weight="400" text-anchor="start">one tiny pad.</text><text x="30" y="482.0" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">RP1: attach supplied 2.4 GHz antenna.</text><text x="30" y="494.15" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">Matek second socket + 3.3/RST pads: NC.</text><text x="30" y="506.3" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#163046" font-weight="400" text-anchor="start">U1 USB-C and microSD: plug-in service ports.</text><rect x="531" y="438" width="281" height="86" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="531" y="438" width="4" height="86" fill="#BD700B" stroke="#BD700B" stroke-width="1"/><text x="544" y="458" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#BD700B" font-weight="700" text-anchor="start">Z- IS A SWITCHED SIGNAL</text><text x="544" y="476.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Finder 2 needs all three wires. Its GND goes to G, while BZ</text><text x="544" y="488.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">goes to Z-. Dronetag uses its own GNSS; no connection to</text><text x="544" y="501.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">U4.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Sources: S03, S05-S08, S20. Use 26 AWG power/ground and 28 AWG signals; route compass away from motor/battery leads.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="575" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="700" text-anchor="start">HISTORICAL FULL-SYSTEM DESIGN - aircraft/trainer build and flight steps are outside current scope.</text><text x="30" y="587" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Current scope: Simantic controller -&gt; physical controller -&gt; simulated drone on screen. See project README.md.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">04</text></svg>