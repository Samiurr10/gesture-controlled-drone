<svg xmlns="http://www.w3.org/2000/svg" width="842" height="595" viewBox="0 0 842 595"><rect x="0" y="0" width="842" height="595" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1"/><text x="30" y="25" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#176BA0" font-weight="700" text-anchor="start">PALMPILOT / MANTA FLOW</text><text x="812" y="25" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="400" text-anchor="end">HISTORICAL REV A  |  14 SEP 2026  |  SCOPE SUPERSEDED</text><text x="30" y="51" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#163046" font-weight="700" text-anchor="start">03 / Every aircraft peripheral wire</text><text x="30" y="70" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#506273" font-weight="400" text-anchor="start">All pin names are board markings. UART wires cross: one board TX goes to the other board RX.</text><line x1="30" y1="80" x2="812" y2="80" stroke="#E9EFF3" stroke-width="1"/><rect x="326" y="100" width="177" height="424" fill="#F6F8FA" stroke="#163046" stroke-width="1"/><text x="339" y="120" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#163046" font-weight="700" text-anchor="start">U1 KAKUTE H7 v1.5</text><rect x="30" y="107" width="158" height="132" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><text x="42" y="128" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#163046" font-weight="700" text-anchor="start">U3 / RP1 V2</text><text x="180" y="153" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#C33736" font-weight="400" text-anchor="end">5V</text><line x1="188" y1="150" x2="326" y2="150" stroke="#C33736" stroke-width="1.2"/><text x="334" y="153" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#C33736" font-weight="400" text-anchor="start">5V</text><text x="250" y="145" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">A01</text><text x="18