vetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">Rear left</text><rect x="635" y="302.5" width="67" height="25.5" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="642" y="318.6" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">CCW</text><rect x="702" y="302.5" width="110" height="25.5" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="709" y="318.6" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">C</text><rect x="503" y="328.0" width="48" height="25.5" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="510" y="344.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">M4</text><rect x="551" y="328.0" width="84" height="25.5" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="558" y="344.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">Front left</text><rect x="635" y="328.0" width="67" height="25.5" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="642" y="344.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">CW</text><rect x="702" y="328.0" width="110" height="25.5" fill="#FFFFFF" stroke="#E9EFF3" stroke-width="0.6"/><text x="709" y="344.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">D</text><rect x="503" y="400" width="309" height="127" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="1"/><rect x="503" y="400" width="4" height="127" fill="#BD700B" stroke="#BD700B" stroke-width="1"/><text x="516" y="420" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#BD700B" font-weight="700" text-anchor="start">PHASE CONNECTION RULE</text><text x="516" y="438.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Mark each motor lead U/V/W and connect all three to one</text><text x="516" y="450.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">numbered bank. The three leads have no + or -. If the motor turns</text><text x="516" y="463.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">the wrong way, change AM32 direction or swap any two phases.</text><text x="516" y="476.475" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">Verify direction viewed from above, with props removed.</text><text x="30" y="487.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">The physical ESC board can rotate to suit the wiring. Bank labels, not the apparent corner of the ESC</text><text x="30" y="499.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">board, choose the motor. Keep the FC orientation arrow toward the nose or configure its measured</text><text x="30" y="512.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">rotation.</text><text x="30" y="553" font-family="Arial,Helvetica,sans-serif" font-size="7.5" fill="#506273" font-weight="400" text-anchor="start">Sources: S04, S18, S21-S23. Install CW/CCW propellers only after motor identity and direction both pass.</text><line x1="30" y1="564" x2="812" y2="564" stroke="#E9EFF3" stroke-width="1"/><text x="30" y="575" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#C33736" font-weight="700" text-anchor="start">HISTORICAL FULL-SYSTEM DESIGN - aircraft/trainer build and flight steps are outside current scope.</text><text x="30" y="587" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#506273" font-weight="400" text-anchor="start">Current scope: Simantic controller -&gt; physical controller -&gt; simulated drone on screen. See project README.md.</text><text x="812" y="581" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#176BA0" font-weight="700" text-anchor="end">07</text></svg>