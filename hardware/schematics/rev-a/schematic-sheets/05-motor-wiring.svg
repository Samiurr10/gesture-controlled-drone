y="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">FRAME_CLASS = 1 (Quad)</text><text x="516" y="149.825" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">FRAME_TYPE = 12 (BetaFlightX)</text><text x="516" y="162.65" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">SERVO1_FUNCTION = 33; SERVO2 = 34</text><text x="516" y="175.475" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#163046" font-weight="400" text-anchor="start">SERVO3_FUNCTION = 35; SERVO4 = 36</text><rect x="503" y="226" width="48" height="25.5" fill="#163046" stroke="#E9EFF3" stroke-width="0.6"/><text x="510" y="242.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#FFFFFF" font-weight="700" text-anchor="start">Bank</text><rect x="551" y="226" width="84" height="25.5" fill="#163046" stroke="#E9EFF3" stroke-width="0.6"/><text x="558" y="242.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#FFFFFF" font-weight="700" text-anchor="start">Location</text><rect x="635" y="226" width="67" height="25.5" fill="#163046" stroke="#E9EFF3" stroke-width="0.6"/><text x="642" y="242.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#FFFFFF" font-weight="700" text-anchor="start">Turn</text><rect x="702" y="226" width="110" height="25.5" fill="#163046" stroke="#E9EFF3" stroke-width="0.6"/><text x="709" y="242.1" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#FFFFFF" font-weight="700" text-anchor="start">Motor test</text><rect x="503" y="251.5" width="48" height="25.5" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="510" y="267.6" font-family="Arial,Helvetica,sans-serif" font-size="9.1" fill="#163046" font-weight="400" text-anchor="start">M1</text><rect x="551" y="251.5" width="84" height="25.5" fill="#F6F8FA" stroke="#E9EFF3" stroke-width="0.6"/><text x="558" y=